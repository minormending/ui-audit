# Visual baselines are platform-specific: macOS produces *-darwin.png, Linux
# *-linux.png, and both are committed. This refreshes them.
#
# WHY BOTH PLATFORMS ARE ONE DISPATCH
#
# This job was Linux-only for a long time, and the Linux half is the half CI
# needs — audit.yml runs on ubuntu-latest and never reads a darwin picture. So
# a Linux-only refresh always looked like it had worked: the suite went green
# and nothing said the other half had been left behind.
#
# It had. The darwin set fell three refreshes behind without anybody noticing,
# because the only thing that reads it is somebody running the suite on their
# own Mac — and when they did, they met 22 red checks that were nothing to do
# with what they had changed. Then it happened again the next day, on a state
# that had just gained two viewports.
#
# So they run together, from one dispatch, and `platforms` exists to narrow it
# deliberately rather than by forgetting.
name: Refresh visual baselines

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated target names (blank = all)'
        required: false
      platforms:
        description: 'Which baselines to write'
        required: false
        default: both
        type: choice
        options: [both, linux, darwin]

permissions:
  contents: write

jobs:
  linux:
    if: inputs.platforms != 'darwin'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      AUDIT_ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui-audit
          fetch-depth: 0

      - name: Install harness
        working-directory: ui-audit
        run: npm ci

      - name: Clone targets
        working-directory: ui-audit
        run: node scripts/fetch-targets.js

      - name: Build Vite targets
        working-directory: ui-audit
        run: node scripts/build-targets.js

      # Only the visual check writes snapshots, and --update-snapshots makes it
      # pass by definition, so a failure here is a real harness or target fault.
      #
      # =all, not the default: plain --update-snapshots only rewrites a
      # snapshot the comparison already called a mismatch, and maxDiffPixelRatio
      # lets small changes through. A stale baseline whose diff sits under that
      # threshold would survive a "refresh baselines" run untouched, which is
      # the one thing this job exists to prevent.
      - name: Generate baselines
        working-directory: ui-audit
        run: npx playwright test visual.spec.js --update-snapshots=all

      - name: Commit any changes
        working-directory: ui-audit
        run: bash .github/commit-baselines.sh linux

  # No container: GitHub's macOS runners do not support them, so the browsers
  # are installed rather than baked in. chromium AND webkit, because only the
  # desktop project is Chrome — iPad (gen 7) and iPhone 13 both resolve to
  # WebKit, so two thirds of every target's pictures come from it.
  darwin:
    # After Linux rather than beside it: both push to the same branch, and two
    # jobs racing that is a lost commit rather than a merge conflict.
    needs: linux
    # `always()` because `needs` otherwise skips this whenever Linux is skipped,
    # which is exactly what platforms: darwin asks for.
    if: ${{ always() && inputs.platforms != 'linux' }}
    runs-on: macos-latest
    env:
      AUDIT_ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install harness
        working-directory: ui-audit
        run: npm ci

      - name: Install browsers
        working-directory: ui-audit
        run: npx playwright install chromium webkit

      - name: Clone targets
        working-directory: ui-audit
        run: node scripts/fetch-targets.js

      - name: Build Vite targets
        working-directory: ui-audit
        run: node scripts/build-targets.js

      - name: Generate baselines
        working-directory: ui-audit
        run: npx playwright test visual.spec.js --update-snapshots=all

      - name: Commit any changes
        working-directory: ui-audit
        run: bash .github/commit-baselines.sh darwin
