# Visual baselines are platform-specific: macOS produces *-darwin.png, CI needs
# *-linux.png. Rather than require Docker locally, generate the Linux set here
# and commit it back.
name: Refresh Linux baselines

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated target names (blank = all)'
        required: false

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      AUDIT_ONLY: ${{ github.event.inputs.only }}
      # Targets that talk to a backend are built against it, so the baselines
      # pin the state a visitor actually sees rather than an unconfigured
      # fallback. Variables, not secrets: a publishable key is designed to be
      # public and is compiled into the bundle regardless. Absent on a fork,
      # these resolve to empty and the target falls back to its sample data.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ui-audit

      - name: Install harness
        working-directory: ui-audit
        run: npm ci

      - name: Clone targets
        working-directory: ui-audit
        run: node scripts/fetch-targets.js

      - name: Build Vite targets
        working-directory: ui-audit
        run: node scripts/build-targets.js

      # Only the visual check writes snapshots, and --update-snapshots makes it
      # pass by definition, so a failure here is a real harness or target fault.
      - name: Generate baselines
        working-directory: ui-audit
        run: npx playwright test visual.spec.js --update-snapshots

      - name: Commit any changes
        working-directory: ui-audit
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks/visual.spec.js-snapshots
          if git diff --cached --quiet; then
            echo "Baselines already current."
            exit 0
          fi
          git commit -m "Refresh Linux visual baselines"
          git push
